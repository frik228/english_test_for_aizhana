<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Grammar Master: Интерактивный Квиз (45 Вопросов)</title>
    <style>
        :root {
            --bg-color: #fcf9f5;
            --card-bg: #ffffff;
            --primary: #8c6d53;
            --primary-hover: #735741;
            --accent: #d4bda8;
            --text-main: #4a403a;
            --text-muted: #827670;
            --success: #6b8e23;
            --error: #bc6c25;
            --border-radius: 16px;
            --box-shadow: 0 10px 30px rgba(140, 109, 83, 0.08);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 40px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-bar-container {
            width: 100%;
            background-color: #f0eae1;
            border-radius: 10px;
            height: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.4s ease;
        }

        .quiz-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .question-title {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.5;
            color: var(--text-main);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-btn {
            background-color: #faf6f0;
            border: 2px solid #ebdccc;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 1rem;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f3ece4;
            border-color: var(--primary);
        }

        .option-btn.selected {
            background-color: #ebdccc;
            border-color: var(--primary);
            font-weight: 600;
        }

        .option-btn.correct {
            background-color: rgba(107, 142, 35, 0.15);
            border-color: var(--success);
            color: #4a5c1a;
        }

        .option-btn.incorrect {
            background-color: rgba(188, 108, 37, 0.15);
            border-color: var(--error);
            color: #8c3f0d;
        }

        .text-input-group {
            margin-bottom: 30px;
        }

        .text-input-group textarea, .text-input-group input {
            width: 100%;
            padding: 16px;
            border: 2px solid #ebdccc;
            border-radius: 12px;
            font-size: 1rem;
            background-color: #faf6f0;
            color: var(--text-main);
            resize: vertical;
            outline: none;
            transition: var(--transition);
        }

        .text-input-group textarea:focus, .text-input-group input:focus {
            border-color: var(--primary);
            background-color: #fff;
        }

        .feedback {
            margin-top: 15px;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.95rem;
            display: none;
            line-height: 1.4;
        }

        .feedback.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .feedback.correct-fb {
            background-color: rgba(107, 142, 35, 0.12);
            color: #4a5c1a;
            border-left: 4px solid var(--success);
        }

        .feedback.incorrect-fb {
            background-color: rgba(188, 108, 37, 0.12);
            color: #8c3f0d;
            border-left: 4px solid var(--error);
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            border-top: 1px solid #f0eae1;
            padding-top: 20px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn:disabled {
            background-color: #d1c7bc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 2px solid #ebdccc;
        }

        .btn-secondary:hover {
            background-color: #f3ece4;
            color: var(--text-main);
        }

        .results-container {
            text-align: center;
            padding: 20px;
        }

        .results-container h2 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #f3ece4;
            border: 6px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px auto;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .results-message {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            header h1 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>English Grammar Master</h1>
        <p>Интерактивный тренажер: 45 продвинутых заданий на основе учебных презентаций</p>
    </header>

    <div class="container" id="quiz-app">

    <footer>
        <p>&copy; 2026 Граматический Квиз-Проджект. Спокойный пастельный стиль Latte & Soft Cream.</p>
    </footer>

    <script>
        // Полная база данных из 45 вопросов на основе прикрепленных презентаций
        const questionsData = [
            // --- Блок 1: Future Tenses (Will, Shall, Going to) (Вопросы 1 - 8) ---
            {

                question: "1. Oh, I left the front door wide open! I ... go and shut it right now.",

            {

            {

                options: ["will be", "is being", "is", "shall be"],
                answer: 0,
                explanation: "Мы часто используем will ('ll) для прогноза или положения дел в данный момент (She'll be busy now)."

            {

                explanation: "Вопрос о длительности незаконченного процесса задается в Present Perfect Continuous."
            },

            // --- Блок 6: Writing / Translation (Письменный перевод) (Вопросы 38 - 41) ---
            {
                block: "Writing & Translation",
                type: "text",
                question: "38. Переведите на английский (используя Past Continuous): «Когда зазвонил телефон, мы ужинали». (Напишите фразу целиком на английском)",
                correctAnswers: [
                    "we were having dinner when the phone rang",
                    "when the phone rang we were having dinner",
                    "we were having dinner when the phone rang.",
                    "we were having dinner when the telephone rang"
                ],
                explanation: "Правильный шаблон: We were having dinner when the phone rang."
            },
            {
                block: "Writing & Translation",
                type: "text",
                question: "39. Переведите на английский (Future Simple / Спонтанное решение): «Здесь так холодно. Я закрою окно». (Напишите: I'll...)",
                correctAnswers: [
                    "i'll close the window",
                    "i will close the window",
                    "i'll shut the window",
                    "i will shut the window"
                ],
                explanation: "Спонтанное решение выражается через I'll close / shut the window."
            },
            {
                block: "Writing & Translation",
                type: "text",
                question: "40. Переведите на английский (Past Perfect Continuous): «Она учила английский язык в течение трех часов, когда пришли друзья». (Напишите начало: She had been studying...)",
                correctAnswers: [
                    "she had been studying english for three hours when her friends came",
                    "she had been studying english for three hours when friends arrived",
                    "she had been studying english for three hours when the friends came"
                ],
                explanation: "She had been studying English for three hours when..."
            },
            {
                block: "Writing & Translation",
                type: "text",
                question: "41. Переведите на английский (Present Perfect): «Я потерял свои ключи, поэтому не могу войти в дом». (Напишите: I've lost...) звено с результатом.",
                correctAnswers: [
                    "i've lost my keys",
                    "i have lost my keys",
                    "i've lost my key",
                    "i have lost my key"
                ],
                explanation: "I've lost my keys."
            },

            // --- Блок 7: Speaking / Future Plans & Creative Tasks (Вопросы 42 - 45) ---
            {
                block: "Speaking & Future Plans",
                type: "text",
                question: "42. Напишите мини-ответ (1 предложение на английском) о своих планах на следующие выходные с использованием конструкции be going to:",
                correctAnswers: ["any"], // Проверяется на непустой ввод
                explanation: "Отличный пример: 'Next weekend I am going to visit my grandparents and relax.'"
            },
            {
                block: "Speaking & Future Plans",
                type: "text",
                question: "43. Творческое задание: Опишите свои планы на будущее, используя Future Continuous. Что вы будете делать завтра ровно в 8 вечера? (Напишите предложение)",
                correctAnswers: ["any"],
                explanation: "Пример: 'Tomorrow at 8 PM I will be watching my favorite movie.'"
            },
            {
                block: "Speaking & Future Plans",
                type: "text",
                question: "44. Развернутый ответ: Расскажите, какой иностранный язык (кроме английского) вы хотели бы выучить и почему? (Напишите кратко по-английски)",
                correctAnswers: ["any"],
                explanation: "Пример: 'I would like to learn Italian because I love its culture and music.'"
            },
            {
                block: "Speaking & Future Plans",
                type: "text",
                question: "45. Итоговое задание Speaking: Опишите свой идеальный рабочий день в будущем с использованием модального глагола will или конструкций прогноза.",
                correctAnswers: ["any"],
                explanation: "Пример: 'In the future, I think I will work remotely and travel all around the world.'"
            }
        ];

        let currentQuestionIndex = 0;
        let userAnswers = {};
        let score = 0;

        const appContainer = document.getElementById('quiz-app');

        function renderQuestion() {
            if (currentQuestionIndex >= questionsData.length) {
                renderResults();
                return;
            }

            const q = questionsData[currentQuestionIndex];
            const progress = ((currentQuestionIndex + 1) / questionsData.length) * 100;

            let html = `
                <div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: ${progress}%"></div>
                    </div>
                    <div class="quiz-meta">
                        <span>Блок: ${q.block}</span>
                        <span>Вопрос ${currentQuestionIndex + 1} из ${questionsData.length}</span>
                    </div>
                    <div class="question-title">${q.question}</div>
            `;

            if (q.type === 'choice') {
                html += `<div class="options-list">`;
                q.options.forEach((opt, idx) => {
                    let btnClass = 'option-btn';
                    let disabledAttr = '';
                    if (userAnswers[currentQuestionIndex] !== undefined) {
                        disabledAttr = 'disabled';
                        if (idx === q.answer) {
                            btnClass += ' correct';
                        } else if (idx === userAnswers[currentQuestionIndex]) {
                            btnClass += ' incorrect';
                        }
                    }
                    html += `<button class="${btnClass}" onclick="selectOption(${idx})" ${disabledAttr}>${String.fromCharCode(65 + idx)}. ${opt}</button>`;
                });
                html += `</div>`;
            } else if (q.type === 'text') {
                const savedVal = userAnswers[currentQuestionIndex] || '';
                const isDisabled = userAnswers[currentQuestionIndex] !== undefined ? 'disabled' : '';
                html += `
                    <div class="text-input-group">
                        <input type="text" id="text-answer" placeholder="Введите ваш ответ на английском..." value="${savedVal}" ${isDisabled}>
                    </div>
                `;
            }

            // Обратная связь
            if (userAnswers[currentQuestionIndex] !== undefined) {
                let isCorrect = false;
                if (q.type === 'choice') {
                    isCorrect = userAnswers[currentQuestionIndex] === q.answer;
                } else {
                    isCorrect = true; // Для творческих заданий / перевода засчитываем ввод
                }
                
                const fbClass = isCorrect ? 'correct-fb' : 'incorrect-fb';
                const fbText = isCorrect ? `Верно! ${q.explanation}` : `Не совсем. Правильный ответ: ${q.options ? q.options[q.answer] : ''}. ${q.explanation}`;
                html += `<div class="feedback show ${fbClass}">${fbText}</div>`;
            }

            html += `
                </div>
                <div class="nav-buttons">
                    <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>Назад</button>
            `;

            if (userAnswers[currentQuestionIndex] === undefined) {
                html += `<button class="btn" onclick="submitAnswer()">Проверить</button>`;
            } else {
                html += `<button class="btn" onclick="nextQuestion()">${currentQuestionIndex === questionsData.length - 1 ? 'Узнать результат' : 'Далее'}</button>`;
            }

            html += `</div>`;

            appContainer.innerHTML = html;
        }

        function selectOption(idx) {
            userAnswers[currentQuestionIndex] = idx;
            renderQuestion();
        }

        function submitAnswer() {
            const q = questionsData[currentQuestionIndex];
            if (q.type === 'choice') {
                // Если не выбрал ничего
                if (userAnswers[currentQuestionIndex] === undefined) return;
                if (userAnswers[currentQuestionIndex] === q.answer) {
                    score++;
                }
            } else {
                const inputVal = document.getElementById('text-answer').value.trim();
                if (!inputVal) {
                    alert('Пожалуйста, введите ответ!');
                    return;
                }
                userAnswers[currentQuestionIndex] = inputVal;
                score++; // Засчитываем письменный ответ
            }
            renderQuestion();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function renderResults() {
            let percentage = Math.round((score / questionsData.length) * 100);
            let message = "";
            if (percentage >= 90) {
                message = "Великолепный результат! Вы отлично усвоили все грамматические темы из презентаций (Future, Past Continuous, Perfect и др.).";
            } else if (percentage >= 70) {
                message = "Хороший уровень знаний! Вы уверенно ориентируетесь в материале, но стоит повторить некоторые сложные правила.";
            } else {
                message = "Неплохая попытка! Рекомендуем еще раз просмотреть прикрепленные презентации и уделить внимание деталям времен.";
            }

            appContainer.innerHTML = `
                <div class="results-container">
                    <h2>Квиз завершен!</h2>
                    <div class="score-circle">${score} / ${questionsData.length}</div>
                    <p class="results-message">${message}</p>
                    <button class="btn" onclick="restartQuiz()">Пройти тест заново</button>
                </div>
            `;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            userAnswers = {};
            score = 0;
            renderQuestion();
        }

        // Инициализация при загрузке
        renderQuestion();
    </script>
</body>
</html>
