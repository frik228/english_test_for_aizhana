<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Grammar Master: Интерактивный Квиз (45 Вопросов)</title>
    <style>
        :root {
            --bg-color: #fcf9f5;
            --card-bg: #ffffff;
            --primary: #8c6d53;
            --primary-hover: #735741;
            --accent: #d4bda8;
            --text-main: #4a403a;
            --text-muted: #827670;
            --success: #6b8e23;
            --error: #bc6c25;
            --border-radius: 16px;
            --box-shadow: 0 10px 30px rgba(140, 109, 83, 0.08);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 40px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-bar-container {
            width: 100%;
            background-color: #f0eae1;
            border-radius: 10px;
            height: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.4s ease;
        }

        .quiz-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .question-title {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.5;
            color: var(--text-main);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-btn {
            background-color: #faf6f0;
            border: 2px solid #ebdccc;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 1rem;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f3ece4;
            border-color: var(--primary);
        }

        .option-btn.selected {
            background-color: #ebdccc;
            border-color: var(--primary);
            font-weight: 600;
        }

        .option-btn.correct {
            background-color: rgba(107, 142, 35, 0.15);
            border-color: var(--success);
            color: #4a5c1a;
        }

        .option-btn.incorrect {
            background-color: rgba(188, 108, 37, 0.15);
            border-color: var(--error);
            color: #8c3f0d;
        }

        .text-input-group {
            margin-bottom: 30px;
        }

        .text-input-group input {
            width: 100%;
            padding: 16px;
            border: 2px solid #ebdccc;
            border-radius: 12px;
            font-size: 1rem;
            background-color: #faf6f0;
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        .text-input-group input:focus {
            border-color: var(--primary);
            background-color: #fff;
        }

        .feedback {
            margin-top: 15px;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.95rem;
            display: none;
            line-height: 1.4;
        }

        .feedback.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .feedback.correct-fb {
            background-color: rgba(107, 142, 35, 0.12);
            color: #4a5c1a;
            border-left: 4px solid var(--success);
        }

        .feedback.incorrect-fb {
            background-color: rgba(188, 108, 37, 0.12);
            color: #8c3f0d;
            border-left: 4px solid var(--error);
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            border-top: 1px solid #f0eae1;
            padding-top: 20px;
            gap: 10px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 22px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn:disabled {
            background-color: #d1c7bc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 2px solid #ebdccc;
        }

        .btn-secondary:hover {
            background-color: #f3ece4;
            color: var(--text-main);
        }

        .btn-skip {
            background-color: #d9c5b2;
            color: #4a403a;
        }
        .btn-skip:hover {
            background-color: #cbb49d;
        }

        .results-container {
            text-align: center;
            padding: 20px;
        }

        .results-container h2 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #f3ece4;
            border: 6px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px auto;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .results-message {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            header h1 {
                font-size: 1.7rem;
            }
            .btn {
                padding: 12px 14px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

        <h1>English Grammar Master</h1>

    <script>
        const questionsData = [
            // Блок 1: Future Tenses (1-8)
            { block: "Future Tenses", type: "choice", question: "1. Oh, I left the front door wide open! I ... go and shut it right now.", options: ["'ll", "am going to", "shall", "go"], answer: 0, explanation: "Используется 'will ('ll)' для спонтанных решений." },
            { block: "Future Tenses", type: "choice", question: "2. Look at those heavy black clouds in the sky! It ... rain very soon.", options: ["will", "shall", "is raining", "is going to"], answer: 3, explanation: "При наличии очевидных признаков сейчас используется be going to." },
            { block: "Future Tenses", type: "choice", question: "3. 'Where shall we have our lunch today?' — 'Let's go to Marino's.' Выберите правильную форму:", options: ["Will we", "Do we", "Are we going to", "Shall we"], answer: 3, explanation: "Shall используется в вопросах для предложений." },
            { block: "Future Tenses", type: "choice", question: "4. My flight to Paris ... next Monday at 8:00 AM (по расписанию).", options: ["will leave", "leaves", "is leaving", "is going to leave"], answer: 1, explanation: "Для расписаний и графиков используется Present Simple." },
            { block: "Future Tenses", type: "choice", question: "5. I'm meeting Kate tomorrow morning at 10:30 (договоренность заранее).", options: ["Личная договоренность / запланированный план", "Спонтанное решение", "Прогноз погоды", "Расписание поездов"], answer: 0, explanation: "Present Continuous используется для личных договоренностей." },
            { block: "Future Tenses", type: "choice", question: "6. I hope Kate ... the driving test tomorrow.", options: ["passes", "will pass", "is going to pass", "passed"], answer: 0, explanation: "После глагола hope используется Present Simple." },
            { block: "Future Tenses", type: "choice", question: "7. The car ... start. (= машина «отказывается» заводиться).", options: ["won't", "shan't", "doesn't", "isn't going to"], answer: 0, explanation: "Won't выражает отказ механизма." },
            { block: "Future Tenses", type: "choice", question: "8. Don't phone Amy right now. She ... busy (прогноз на текущий момент).", options: ["will be", "is being", "is", "shall be"], answer: 0, explanation: "Will ('ll) используется для логического предположения о настоящем." },

            // Блок 2: Future Continuous & Perfect (9-14)
            { block: "Future Continuous & Perfect", type: "choice", question: "9. This time next week I ... on a beach, lying under the sun.", options: ["will lie", "will be lying", "will have lain", "am lying"], answer: 3, explanation: "Future Continuous описывает процесс в определенный момент в будущем." },
            { block: "Future Continuous & Perfect", type: "choice", question: "10. Don't phone between 7 and 8 PM. We ... dinner at that time.", options: ["will eat", "will be eating", "eat", "are eating"], answer: 1, explanation: "Действие в процессе в конкретный промежуток будущего времени." },
            { block: "Future Continuous & Perfect", type: "choice", question: "11. Sally always leaves for work at 8:30. At 9:00 she won't be at home — she ... to work.", options: ["will have gone", "will go", "will be going", "goes"], answer: 0, explanation: "Future Perfect показывает завершенность действия к моменту в будущем." },
            { block: "Future Continuous & Perfect", type: "choice", question: "12. Next year Ted and Amy ... married for 25 years.", options: ["will be", "will have been", "have been", "had been"], answer: 1, explanation: "Для длительных состояний к рубежу в будущем используется Future Perfect." },
            { block: "Future Continuous & Perfect", type: "choice", question: "13. By the time we arrive at the cinema, the film already ...", options: ["will have started", "will start", "will be starting", "starts"], answer: 0, explanation: "Future Perfect употребляется с by the time для завершенных к сроку действий." },
            { block: "Future Continuous & Perfect", type: "choice", question: "14. 'Later in the programme, I ... talking to the Minister of Education.'", options: ["will", "will be", "am going to", "shall"], answer: 1, explanation: "Will be -ing используется для анонса пунктов программы." },

            // Блок 3: Past Continuous (15-22)
            { block: "Past Continuous", type: "choice", question: "15. Yesterday at 10:30 AM, Karen and Joe ... tennis.", options: ["played", "were playing", "was playing", "had played"], answer: 3, explanation: "Past Continuous — процесс в определенный момент прошлого." },
            { block: "Past Continuous", type: "choice", question: "16. Выберите правильное отрицание в Past Continuous для множественного числа:", options: ["they weren't working", "they didn't working", "they hadn't working", "they weren't worked"], answer: 0, explanation: "Формула: weren't + V-ing." },
            { block: "Past Continuous", type: "choice", question: "17. What ... you ... at 10 o'clock last night?", options: ["did / do", "were / doing", "was / doing", "had / done"], answer: 1, explanation: "Вопрос в Past Continuous: Were + подлежащее + V-ing." },
            { block: "Past Continuous", type: "choice", question: "18. 'We were walking home when I met Dan' означает:", options: ["Путь полностью завершен", "Процесс ходьбы прерван кратким действием", "Дэн шел с нами", "Ошибка в грамматике"], answer: 1, explanation: "Фоновый процесс прерывается коротким действием в Past Simple." },
            { block: "Past Continuous", type: "choice", question: "19. Какой глагол НЕЛЬЗЯ использовать в Continuous?", options: ["study", "know", "run", "play"], answer: 3, explanation: "Know — стативный глагол, не используется в Continuous." },
            { block: "Past Continuous", type: "choice", question: "20. Matt phoned while we ... dinner.", options: ["had", "were having", "had been having", "have had"], answer: 1, explanation: "Звонок (Past Simple) прервал процесс ужина (Past Continuous)." },
            { block: "Past Continuous", type: "choice", question: "21. 'We ... home after the party last night.' (Завершенный путь до конца)", options: ["walked", "were walking", "had walked", "walk"], answer: 0, explanation: "Полное завершенное действие выражается через Past Simple." },
            { block: "Past Continuous", type: "choice", question: "22. I waved to Helen, but she ... looking.", options: ["wasn't", "weren't", "didn't", "hadn't"], answer: 0, explanation: "С местоимением she в Past Continuous отрицание — wasn't." },

            // Блок 4: Past Perfect & Continuous (23-30)
            { block: "Past Perfect & Continuous", type: "choice", question: "23. When Sarah arrived at the party, Paul wasn't there. He ... home.", options: ["went", "had already gone", "has gone", "was going"], answer: 1, explanation: "Действие раньше другого прошлого момента требует Past Perfect." },
            { block: "Past Perfect & Continuous", type: "choice", question: "24. Формула Past Perfect Continuous:", options: ["Subject + had + V3", "Subject + had been + V-ing", "Subject + was/were + V-ing", "Subject + have been + V-ing"], answer: 1, explanation: "Subject + had been + V-ing." },
            { block: "Past Perfect & Continuous", type: "choice", question: "25. She was very tired because she ... a marathon all morning.", options: ["had been running", "ran", "has run", "was running"], answer: 0, explanation: "Длительный процесс перед прошлым моментом с видимым результатом." },
            { block: "Past Perfect & Continuous", type: "choice", question: "26. When we got home last night, we found that somebody ... into the flat.", options: ["broke", "had broken", "was breaking", "has broken"], answer: 1, explanation: "Взломали квартиру раньше нашего прихода — Past Perfect." },
            { block: "Past Perfect & Continuous", type: "choice", question: "27. He ... for the exam for hours before the phone rang.", options: ["had been studying", "studied", "was studying", "has studied"], answer: 0, explanation: "Длительность действия до события в прошлом." },
            { block: "Past Perfect & Continuous", type: "choice", question: "28. The people sitting next to me on the plane were nervous. They ... never before.", options: ["didn't fly", "haven't flown", "hadn't flown", "weren't flying"], answer: 2, explanation: "Опыт до полета в прошлом — Past Perfect." },
            { block: "Past Perfect & Continuous", type: "choice", question: "29. Next year Ted and Amy will have been married... А в Past Perfect:", options: ["They had been married for 24 years.", "They have been married.", "They were married.", "They are married."], answer: 0, explanation: "Сопоставление времен из презентации." },
            { block: "Past Perfect & Continuous", type: "choice", question: "30. Исправьте ошибку в 'Yesterday, Sarah was tired because she ran a marathon.' Замените ran на:", options: ["she had run a marathon", "she is running", "she runs", "she was running"], answer: 0, explanation: "Факт, совершенный до другого прошлого момента — Past Perfect (had run)." },

            // Блок 5: Present Perfect & Continuous (31-37)
            { block: "Present Perfect & Continuous", type: "choice", question: "31. Tom can't find his key. He ... his key.", options: ["has lost", "lost", "had lost", "is losing"], answer: 0, explanation: "Прошлое действие с результатом в настоящем — Present Perfect." },
            { block: "Present Perfect & Continuous", type: "choice", question: "32. Почему у тебя одышка? Выберите вопрос:", options: ["What did you do?", "What have you been doing?", "What do you do?", "What were you doing?"], answer: 1, explanation: "Только что завершившийся процесс с результатом сейчас." },
            { block: "Present Perfect & Continuous", type: "choice", question: "33. 'I've been painting my bedroom' (1) и 'I've painted my bedroom' (2). Какое предложение означает полностью завершенный ремонт?", options: ["Только 1", "Только 2", "Оба", "Ни одно"], answer: 1, explanation: "Simple (I've painted) говорит о готовом результате." },
            { block: "Present Perfect & Continuous", type: "choice", question: "34. Какое время в американском английском часто заменяет британский Present Perfect ('I have just had lunch')?", options: ["Past Simple ('I just had lunch')", "Past Continuous", "Past Perfect", "Future Simple"], answer: 0, explanation: "В US English часто используется Past Simple с just/already/yet." },
            { block: "Present Perfect & Continuous", type: "choice", question: "35. It's the first time I ... a car.", options: ["drive", "drove", "have driven", "had driven"], answer: 2, explanation: "Структура 'It's the first time someone has done' требует Present Perfect." },
            { block: "Present Perfect & Continuous", type: "choice", question: "36. We ... waiting for the bus for over an hour now!", options: ["have been", "had been", "are", "were"], answer: 0, explanation: "Действие с прошлого продолжается сейчас — Present Perfect Continuous." },
            { block: "Present Perfect & Continuous", type: "choice", question: "37. How long ... you ... English?", options: ["do / learn", "have / been learning", "did / learn", "are / learning"], answer: 1, explanation: "Вопрос о непрекращающемся процессе длительности." },

            // Блок 6: Writing / Translation (Письменный перевод) (38-41)
            { 
                block: "Writing & Translation", 
                type: "text", 
                question: "38. Выполните перевод на английский язык (используя Past Continuous): «Когда зазвонил телефон, мы ужинали».", 
                correctAnswers: [
                    "we were having dinner when the phone rang", 
                    "we were having dinner when the telephone rang"
                ], 
                explanation: "Поддерживается вариативность порядка частей предложения (можно начать с придаточного времени)." 
            },
            { 
                block: "Writing & Translation", 
                type: "text", 
                question: "39. Выполните перевод на английский язык (выражение спонтанного решения): «Здесь так холодно. Я закрою окно».", 
                correctAnswers: [
                    "i'll close the window", 
                    "i will close the window", 
                    "i'll shut the window", 
                    "i will shut the window"
                ], 
                explanation: "Спонтанное решение выражается через I'll close / shut the window." 
            },
            { 
                block: "Writing & Translation", 
                type: "text", 
                question: "40. Выполните перевод на английский язык (используя Past Perfect Continuous): «Она учила английский язык в течение трех часов, когда пришли друзья».", 
                correctAnswers: [
                    "she had been studying english for three hours when her friends came", 
                    "she had been studying english for three hours when friends arrived",
                    "she had been studying english for three hours when the friends came"
                ], 
                explanation: "She had been studying English for three hours when..." 
            },
            { 
                block: "Writing & Translation", 
                type: "text", 
                question: "41. Выполните перевод на английский язык (используя Present Perfect с результатом в настоящем): «Я потерял свои ключи, поэтому не могу войти в дом».", 
                correctAnswers: [
                    "i've lost my keys", 
                    "i have lost my keys", 
                    "i've lost my key", 
                    "i have lost my key"
                ], 
                explanation: "I've lost my keys." 
            },

            // Блок 7: Speaking / Future Plans & Creative Tasks (42-45)
            { 
                block: "Speaking & Future Plans", 
                type: "text", 
                question: "42. Напишите полноценное предложение на английском о своих планах на выходные с использованием be going to:", 
                correctAnswers: [
                    "i am going to visit my grandparents", 
                    "i'm going to travel next weekend", 
                    "i am going to relax this weekend",
                    "i am going to study english"
                ], 
                explanation: "Пример: 'I am going to visit my grandparents.'" 
            },
            { 
                block: "Speaking & Future Plans", 
                type: "text", 
                question: "43. Опишите с помощью Future Continuous, что вы будете делать завтра ровно в 8 вечера:", 
                correctAnswers: [
                    "tomorrow at 8 pm i will be watching a movie", 
                    "i will be studying at 8 o'clock tomorrow", 
                    "i will be working at this time tomorrow"
                ], 
                explanation: "Пример: 'Tomorrow at 8 PM I will be watching a movie.'" 
            },
            { 
                block: "Speaking & Future Plans", 
                type: "text", 
                question: "44. Какой иностранный язык вы хотели бы выучить и почему? Дайте развернутый ответ на английском:", 
                correctAnswers: [
                    "i would like to learn italian because i love its culture", 
                    "i want to learn spanish because it is useful", 
                    "i would like to study german for my career"
                ], 
                explanation: "Пример: 'I would like to learn Italian because I love its culture.'" 
            },
            { 
                block: "Speaking & Future Plans", 
                type: "text", 
                question: "45. Опишите свой идеальный рабочий день в будущем (используя will):", 
                correctAnswers: [
                    "in the future i think i will work remotely and travel", 
                    "i will have a flexible schedule and write software", 
                    "i will work as a developer and manage my time"
                ], 
                explanation: "Пример: 'In the future I think I will work remotely and travel.'" 
            }
        ];

        let currentQuestionIndex = 0;
        let userAnswers = {};
        let score = 0;

        const appContainer = document.getElementById('quiz-app');

        function normalizeText(text) {
            return text
                .toLowerCase()
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g, "")
                .replace(/\s{2,}/g, " ")
                .trim();
        }

        function validateTextAnswer(questionIndex, rawInput) {
            const cleanedInput = rawInput.trim();

            if (cleanedInput.length < 5) {
                return {
                    isCorrect: false,
                    message: "Слишком короткий ответ. Проверьте грамматику и форму времени."
                };
            }

            const alphaOnly = cleanedInput.toLowerCase().replace(/[^a-z]/g, '');
            if (/^(.)\1+$/.test(alphaOnly) || /(..)\1{2,}/.test(alphaOnly)) {
                return {
                    isCorrect: false,
                    message: "Некорректный ввод. Проверьте грамматику и форму времени."
                };
            }

            if (/[а-яё]/i.test(rawInput)) {
                return {
                    isCorrect: false,
                    message: "Пожалуйста, пишите ответ на английском языке."
                };
            }

            if (!cleanedInput.includes(' ') && questionIndex < 42) {
                return {
                    isCorrect: false,
                    message: "Введите предложение целиком, используя пробелы."
                };
            }

            const q = questionsData[questionIndex];
            
            if (q.correctAnswers) {
                const normInput = normalizeText(cleanedInput);
                const isMatched = q.correctAnswers.some(ans => {
                    const normAns = normalizeText(ans);
                    if (normAns === normInput) return true;
                    
                    // Универсальная гибкая проверка для ВСЕХ письменных предложений:
                    // если предложение содержит союзы/маркеры (when, because, while, before, after), 
                    // проверяем вариант с перестановкой частей местами.
                    const splitKeywords = ["when", "because", "while", "before", "after"];
                    for (let kw of splitKeywords) {
                        if (normAns.includes(kw) && normInput.includes(kw)) {
                            const partsAns = normAns.split(kw);
                            const partsInput = normInput.split(kw);
                            if (partsAns.length === 2 && partsInput.length === 2) {
                                const matchDirect = (normalizeText(partsAns[0]) === normalizeText(partsInput[0]) && 
                                                     normalizeText(partsAns[1]) === normalizeText(partsInput[1]));
                                const matchInverted = (normalizeText(partsAns[0]) === normalizeText(partsInput[1]) && 
                                                       normalizeText(partsAns[1]) === normalizeText(partsInput[0]));
                                if (matchDirect || matchInverted) return true;
                            }
                        }
                    }
                    return false;
                });

                return {
                    isCorrect: isMatched,
                    message: isMatched ? "Верно!" : "Неверный вариант перевода. Проверьте грамматику и форму времени."
                };
            }

            const words = cleanedInput.split(/\s+/);
            if (words.length < 3) {
                return {
                    isCorrect: false,
                    message: "Дайте более развернутый ответ (минимум 3 слова)."
                };
            }

            return { isCorrect: true, message: "Принято!" };
        }

        function renderQuestion() {
            if (currentQuestionIndex >= questionsData.length) {
                renderResults();
                return;
            }

            const q = questionsData[currentQuestionIndex];
            const progress = ((currentQuestionIndex + 1) / questionsData.length) * 100;

            let html = `
                <div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: ${progress}%"></div>
                    </div>
                    <div class="quiz-meta">
                        <span>Блок: ${q.block}</span>
                        <span>Вопрос ${currentQuestionIndex + 1} из ${questionsData.length}</span>
                    </div>
                    <div class="question-title">${q.question}</div>
            `;

            if (q.type === 'choice') {
                html += `<div class="options-list">`;
                q.options.forEach((opt, idx) => {
                    let btnClass = 'option-btn';
                    let disabledAttr = '';
                    if (userAnswers[currentQuestionIndex] !== undefined) {
                        disabledAttr = 'disabled';
                        if (idx === q.answer) {
                            btnClass += ' correct';
                        } else if (idx === userAnswers[currentQuestionIndex]) {
                            btnClass += ' incorrect';
                        }
                    }
                    html += `<button class="${btnClass}" onclick="selectOption(${idx})" ${disabledAttr}>${String.fromCharCode(65 + idx)}. ${opt}</button>`;
                });
                html += `</div>`;
            } else if (q.type === 'text') {
                const savedVal = userAnswers[currentQuestionIndex] === "SKIPPED" ? '' : (userAnswers[currentQuestionIndex] || '');
                const isDisabled = userAnswers[currentQuestionIndex] !== undefined && userAnswers[currentQuestionIndex] !== "SKIPPED" ? 'disabled' : '';
                html += `
                    <div class="text-input-group">
                        <input type="text" id="text-input-answer" placeholder="Введите ваш вариант на английском..." value="${savedVal}" ${isDisabled}>
                    </div>
                `;
            }

            if (userAnswers[currentQuestionIndex] !== undefined && userAnswers[currentQuestionIndex] !== "SKIPPED") {
                let isCorrect = false;
                let feedbackText = "";

                if (q.type === 'choice') {
                    isCorrect = userAnswers[currentQuestionIndex] === q.answer;
                    feedbackText = isCorrect ? `Верно! ${q.explanation}` : `Неверно. Проверьте правила и попробуйте еще раз.`;
                } else {
                    const validationRes = validateTextAnswer(currentQuestionIndex, userAnswers[currentQuestionIndex]);
                    isCorrect = validationRes.isCorrect;
                    feedbackText = isCorrect ? `Верно! ${q.explanation}` : `Не совсем верно. ${validationRes.message}`;
                }
                
                const fbClass = isCorrect ? 'correct-fb' : 'incorrect-fb';
                html += `<div class="feedback show ${fbClass}">${feedbackText}</div>`;
            }

            html += `
                </div>
                <div class="nav-buttons">
                    <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>Назад</button>
                    <button class="btn btn-skip" onclick="skipQuestion()">Пропустить</button>
            `;

            if (userAnswers[currentQuestionIndex] === undefined || userAnswers[currentQuestionIndex] === "SKIPPED") {
                html += `<button class="btn" onclick="submitAnswer()">Проверить</button>`;
            } else {
                html += `<button class="btn" onclick="nextQuestion()">${currentQuestionIndex === questionsData.length - 1 ? 'Узнать результат' : 'Далее'}</button>`;
            }

            html += `</div>`;

            appContainer.innerHTML = html;
        }

        function selectOption(idx) {
            userAnswers[currentQuestionIndex] = idx;
            renderQuestion();
        }

        function submitAnswer() {
            const q = questionsData[currentQuestionIndex];
            
            if (q.type === 'choice') {
                if (userAnswers[currentQuestionIndex] === undefined) return;
                if (userAnswers[currentQuestionIndex] === q.answer) {
                    score++;
                }
            } else if (q.type === 'text') {
                const inputField = document.getElementById('text-input-answer');
                const inputVal = inputField.value.trim();
                
                if (!inputVal) {
                    alert('Пожалуйста, введите ответ!');
                    return;
                }

                const validationRes = validateTextAnswer(currentQuestionIndex, inputVal);
                
                if (!validationRes.isCorrect) {
                    alert(validationRes.message);
                    return;
                }

                userAnswers[currentQuestionIndex] = inputVal;
                score++;
            }
            renderQuestion();
        }

        function skipQuestion() {
            userAnswers[currentQuestionIndex] = "SKIPPED";
            nextQuestion();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function renderResults() {
            let percentage = Math.round((score / questionsData.length) * 100);
            let message = "";
            if (percentage >= 90) {
                message = "Великолепный результат! Вы отлично усвоили грамматический материал из презентаций.";
            } else if (percentage >= 70) {
                message = "Хороший уровень знаний! Вы уверенно ориентируетесь в темах времен английского языка.";
            } else {
                message = "Неплохая попытка! Рекомендуем повторить правила по материалам презентаций.";
            }

            appContainer.innerHTML = `
                <div class="results-container">
                    <h2>Квиз завершен!</h2>
                    <div class="score-circle">${score} / ${questionsData.length}</div>
                    <p class="results-message">${message}</p>
                    <button class="btn" onclick="restartQuiz()">Пройти тест заново</button>
                </div>
            `;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            userAnswers = {};
            score = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
